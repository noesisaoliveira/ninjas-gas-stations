name: Ninjas Gas Stations
version: 0.1.0
slug: ninjas_gas_stations
description: Find nearby fuel stations and compare DGEG prices in Portugal
url: https://github.com/noesisaoliveira/ninjas-gas-stations
homeassistant: 2025.11.0
arch:
  - amd64
  - aarch64
startup: application
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:gas-station
panel_title: Gas Stations
map:
  - type: data
    read_only: false
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Optional direct API access. Configure an API token before exposing.
options:
  default_radius_km: 15
  default_limit: 5
  cache_ttl_minutes: 60
  brands_include: []
  brands_exclude: []
  api_token: ""
  allowed_origins: ""
  trusted_ingress_cidrs:
    - 172.30.32.2/32
  log_level: INFO
schema:
  default_radius_km: int(1,500)
  default_limit: int(1,50)
  cache_ttl_minutes: int(5,1440)
  brands_include:
    - str
  brands_exclude:
    - str
  api_token: password
  allowed_origins: str
  trusted_ingress_cidrs:
    - str
  log_level: list(DEBUG|INFO|WARNING|ERROR)
